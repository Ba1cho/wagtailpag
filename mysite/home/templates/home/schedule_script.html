<script>
/* Расписание занятий: фильтры, карточки групп и недельный таймлайн (jQuery). */
$(function () {
  'use strict';

  var $curatorSelect = $('#sch-curator-select');
  var $groupList = $('#sch-group-list');
  var $groupAll = $('#sch-group-all');
  var $groupEmpty = $('#sch-group-empty');
  var $weekdayRow = $('#sch-weekday-row');
  var $weekSelect = $('#sch-week-select');
  var $hourFrom = $('#sch-hour-from');
  var $hourTo = $('#sch-hour-to');
  var $resetBtn = $('#sch-reset');
  var $dependentFilters = $('#sch-dependent-filters');
  var $dependentContent = $('#sch-dependent-content');
  var $dependentHint = $('#sch-dependent-hint');
  var $cards = $('#sch-cards > .sch-card');
  var $timeline = $('#sch-timeline');
  var $weekRoot = $('#sch-week');
  var $dayCols = $timeline.find('.sch-wk-day');
  var $dayHeaders = $timeline.find('.sch-wk-head-day');
  var $weekBlocks = $timeline.find('.sch-wk-block');
  var $legendItems = $timeline.find('.sch-wk-legend-item');
  var $nothing = $('#sch-nothing');
  var $modal = $('#sch-group-modal');
  var $modalBody = $('#sch-group-modal-body');

  var MIN_HOUR = 6, MAX_HOUR = 23, HOUR_PX = 56; // должно совпадать с --hour-h и range(6, 23) в модели
  var WEEKDAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  var state = { curator: '', weekday: 'all', weekStart: '', weekEnd: '', hourFrom: '', hourTo: '' };
  var groupMeta = {}; // pk группы -> { curator, label, check, enabled }
  var weekBuilt = false;

  /* Локальная дата в формате YYYY-MM-DD (совпадает с data-date из Django). */
  function isoDate(d) {
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + month + '-' + day;
  }

  function setChipActive($container, $chip) {
    $container.find('.chip').removeClass('active');
    $chip.addClass('active');
  }

  function toMinutes(hhmm) {
    var p = String(hhmm || '').split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  /* Все группы есть в DOM всегда (даже скрытые фильтром куратора). */
  $groupList.find('.sch-check[data-group]').each(function () {
    var $label = $(this);
    var $check = $label.find('input[type="checkbox"]');
    groupMeta[$label.attr('data-group')] = {
      curator: $label.attr('data-curator') || '',
      label: $label,
      check: $check,
      enabled: $check.prop('checked')
    };
  });

  /* Текущая неделя (пн–пт) выбрана в select на сервере. */
  function readWeekFromSelect() {
    if (!$weekSelect.length) return;
    var $option = $weekSelect.find('option:selected');
    state.weekStart = $weekSelect.val();
    state.weekEnd = $option.length ? ($option.attr('data-end') || '') : '';
  }
  readWeekFromSelect();

  /* Пересечение промежутка [from, to) с промежутком занятия [start, end) */
  function intervalMatches(startMin, endMin) {
    if (state.hourFrom === '' && state.hourTo === '') return true;
    var from = state.hourFrom === '' ? MIN_HOUR * 60 : parseInt(state.hourFrom, 10) * 60;
    var to = state.hourTo === '' ? MAX_HOUR * 60 : parseInt(state.hourTo, 10) * 60;
    return startMin < to && endMin > from;
  }

  function lessonTime($el) {
    var start = toMinutes($el.attr('data-start'));
    var end = toMinutes($el.attr('data-end'));
    if (isNaN(start) || isNaN(end)) return null;
    if (end <= start) end = start + 60;
    return { start: start, end: end };
  }

  /* Фильтр по дню недели (у каждого занятия есть конкретная дата). */
  function weekdayMatches($el) {
    if (state.weekday === 'all') return true;
    return $el.attr('data-weekday') === state.weekday;
  }

  /* Дата внутри выбранной недели (пн–пт, сравнение ISO-строк). */
  function dateMatches($el) {
    if (!state.weekStart) return true;
    var iso = $el.attr('data-date');
    return iso >= state.weekStart && iso <= state.weekEnd;
  }

  /* Группа относится к выбранному куратору.
     Пока куратор не выбран — расписание пустое (каскад: куратор -> остальные фильтры). */
  function inCuratorScope(pk) {
    if (state.curator === '') return false;
    var meta = groupMeta[pk];
    return !!meta && meta.curator === state.curator;
  }

  /* Занятие активно: есть хотя бы одна его группы выбранного куратора,
     и у этой группы не снята галочка в списке групп. */
  function lessonGroupsOk($el) {
    var groups = $el.attr('data-groups');
    var pks = groups ? groups.split(',') : [];
    for (var i = 0; i < pks.length; i++) {
      var meta = groupMeta[pks[i]];
      if (meta && meta.enabled && inCuratorScope(pks[i])) return true;
    }
    return false;
  }

  function cardGroupOk($card) {
    var meta = groupMeta[$card.attr('data-group')];
    var enabled = meta ? meta.enabled : true;
    var curator = meta ? meta.curator : ($card.attr('data-curator') || '');
    if (!enabled) return false;
    return state.curator !== '' && curator === state.curator;
  }

  function rowMatches($tr) {
    if (!weekdayMatches($tr) || !dateMatches($tr)) return false;
    var start = parseInt($tr.attr('data-start-hour'), 10) * 60;
    return intervalMatches(start, start + 60);
  }

  function blockMatches($el) {
    if (!weekdayMatches($el) || !dateMatches($el)) return false;
    if (!lessonGroupsOk($el)) return false;
    var t = lessonTime($el);
    if (!t) return false;
    return intervalMatches(t.start, t.end);
  }

  /* Показ/скрытие пунктов списка групп по выбранному куратору.
     Отключённые группы не исчезают — остаются в списке неактивными. */
  function refreshGroupList() {
    var visible = 0;
    $.each(groupMeta, function (pk, meta) {
      var show = state.curator !== '' && meta.curator === state.curator;
      meta.label.toggleClass('hidden', !show);
      if (show) visible++;
    });
    if ($groupEmpty.length) $groupEmpty.toggleClass('hidden', visible > 0);
    syncGroupAll();
  }

  /* Каскад фильтров: пока куратор не выбран — скрыты остальные фильтры и расписание. */
  function updateCascade() {
    var curatorChosen = state.curator !== '';
    if ($dependentFilters.length) $dependentFilters.toggleClass('d-none', !curatorChosen);
    if ($dependentContent.length) $dependentContent.toggleClass('d-none', !curatorChosen);
    if ($dependentHint.length) $dependentHint.toggleClass('d-none', curatorChosen);
  }

  /* Мастер-галочка «Все группы» отражает состояние групп в области видимости. */
  function syncGroupAll() {
    if (!$groupAll.length) return;
    var any = false, all = true;
    $.each(groupMeta, function (pk, meta) {
      if (meta.label.hasClass('hidden')) return;
      any = true;
      if (!meta.enabled) all = false;
    });
    $groupAll.prop('checked', any && all);
  }

  function updateBadges() {
    $cards.each(function () {
      var $card = $(this);
      var $badge = $card.find('.sch-badge-count');
      if (!$badge.length) return;
      $badge.text($card.find('tbody tr:not(.hidden)').length + ' зан.');
    });
  }

  function apply() {
    var visibleCards = 0;
    var weekHasVisible = false;

    $cards.each(function () {
      var $card = $(this);
      var groupOk = cardGroupOk($card);
      var anyVisible = false;
      if (groupOk) {
        var $rows = $card.find('tbody tr');
        $rows.each(function () {
          var $tr = $(this);
          var ok = rowMatches($tr);
          $tr.toggleClass('hidden', !ok);
          if (ok) anyVisible = true;
        });
        if ($rows.length === 0) anyVisible = true;
      }
      $card.toggleClass('hidden', !(groupOk && anyVisible));
      if (groupOk && anyVisible) visibleCards++;
    });
    updateBadges();

    $weekBlocks.each(function () {
      var $el = $(this);
      var ok = blockMatches($el);
      $el.toggleClass('hidden', !ok);
      if (ok) weekHasVisible = true;
    });
    $dayCols.each(function () {
      var $col = $(this);
      $col.toggleClass('dim', state.weekday !== 'all' && $col.attr('data-weekday') !== state.weekday);
    });
    $dayHeaders.each(function () {
      var $h = $(this);
      $h.toggleClass('dim', state.weekday !== 'all' && $h.attr('data-weekday') !== state.weekday);
    });
    $legendItems.each(function () {
      var $item = $(this);
      var meta = groupMeta[$item.attr('data-group')];
      var active = !!meta && meta.enabled && state.curator !== '' && meta.curator === state.curator;
      $item.toggleClass('inactive', !active);
    });
    layoutLanes();

    /* Сообщение «не найдено» — только если пусто и в карточках, и в таймлайне. */
    $nothing.toggleClass('hidden', visibleCards > 0 || weekHasVisible);
  }

  /* Даты в шапке таймлайна = выбранная неделя (пн–пт), + метка «сегодня». */
  function updateWeekHeaders() {
    if (!state.weekStart) return;
    var parts = state.weekStart.split('-');
    var monday = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    var todayKey = isoDate(new Date());
    function dateFor(index) {
      return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + index);
    }
    $dayHeaders.each(function () {
      var $h = $(this);
      var index = WEEKDAY_KEYS.indexOf($h.attr('data-weekday'));
      if (index < 0 || index > 4) return;
      var d = dateFor(index);
      var $span = $h.find('.sch-wk-head-date');
      if ($span.length) {
        $span.text(String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      $h.toggleClass('today', isoDate(d) === todayKey);
    });
    $dayCols.each(function () {
      var $col = $(this);
      var index = WEEKDAY_KEYS.indexOf($col.attr('data-weekday'));
      if (index < 0 || index > 4) return;
      $col.toggleClass('today', isoDate(dateFor(index)) === todayKey);
    });
    updateNowLine();
  }

  /* Линия «сейчас» — только если сегодня попадает в выбранную неделю. */
  function updateNowLine() {
    if (!$timeline.length) return;
    $timeline.find('.sch-wk-now').remove();
    if (!state.weekStart) return;
    var now = new Date();
    var todayKey = isoDate(now);
    if (todayKey < state.weekStart || todayKey > state.weekEnd) return;
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < MIN_HOUR * 60 || nowMin > MAX_HOUR * 60) return;
    var wd = WEEKDAY_KEYS[(now.getDay() + 6) % 7];
    var $col = $timeline.find('.sch-wk-day[data-weekday="' + wd + '"]');
    if (!$col.length) return;
    $('<div class="sch-wk-now"></div>')
      .css('top', (((nowMin - MIN_HOUR * 60) / 60) * HOUR_PX) + 'px')
      .appendTo($col);
  }

  /* Первичная разметка сетки: позиции блоков по времени + даты в шапке */
  function positionWeek() {
    if (!$weekRoot.length) return;
    if (!weekBuilt) {
      weekBuilt = true;
      $weekBlocks.each(function () {
        var $el = $(this);
        var t = lessonTime($el);
        if (!t) { $el.addClass('hidden'); return; }
        $el.attr('data-end-min', String(t.end));
        $el.css('top', (((t.start - MIN_HOUR * 60) / 60) * HOUR_PX) + 'px');
        $el.css('height', Math.max(((t.end - t.start) / 60 * HOUR_PX) - 4, 18) + 'px');
      });
    }
    updateWeekHeaders();
  }

  /* Раскладка занятий дня по «дорожкам», если они пересекаются по времени */
  function layoutLanes() {
    $dayCols.each(function () {
      var $col = $(this);
      var $blocks = $col.find('.sch-wk-block').filter(function () {
        return !$(this).hasClass('hidden');
      });
      $blocks.sort(function (a, b) {
        var sa = toMinutes($(a).attr('data-start')), sb = toMinutes($(b).attr('data-start'));
        if (sa !== sb) return sa - sb;
        var ea = parseInt($(a).attr('data-end-min') || $(a).attr('data-end'), 10);
        var eb = parseInt($(b).attr('data-end-min') || $(b).attr('data-end'), 10);
        return ea - eb;
      });
      var laneEnds = [];
      $blocks.each(function () {
        var $el = $(this);
        var start = toMinutes($el.attr('data-start'));
        var end = parseInt($el.attr('data-end-min') || $el.attr('data-end'), 10);
        if (isNaN(start) || isNaN(end)) return;
        var lane = -1;
        for (var i = 0; i < laneEnds.length; i++) {
          if (laneEnds[i] <= start) { lane = i; break; }
        }
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(end); }
        else { laneEnds[lane] = end; }
        $el.css('left', 'calc(' + lane + ' * var(--lane-w))');
        $el.css('width', 'calc(var(--lane-w) - 6px)');
      });
      var laneCount = Math.max(1, laneEnds.length);
      $col[0].style.setProperty('--lane-w', (100 / laneCount) + '%');
    });
  }

  /* ---- Модальное окно группы (клик по карточке/названию в списке) ---- */
  function openCard(pk) {
    if (!$modal.length || !$modalBody.length) return;
    var $card = $('#sch-cards > .sch-card[data-group="' + pk + '"]');
    $modalBody.empty();
    if ($card.length) {
      $card.clone().removeClass('hidden selected').appendTo($modalBody);
    }
    $modal.removeClass('hidden');
    $('body').addClass('sch-modal-open');
  }

  /* Модалка со составом группы — открывается кликом по группе в фильтрах. */
  function openRoster(pk) {
    if (!$modal.length || !$modalBody.length) return;
    var $roster = $('#sch-group-rosters > [data-group="' + pk + '"]');
    $modalBody.empty();
    if ($roster.length) {
      var $students = $roster.children('.sch-roster-student');
      var $wrap = $('<div class="sch-roster"></div>');
      $wrap.append(
        $('<h2 class="sch-roster-title"></h2>').text($roster.attr('data-name') || '')
      );
      var $curator = $('<p class="sch-curator"></p>');
      var curatorName = $roster.attr('data-curator-name') || '';
      if (curatorName) {
        $curator.append(document.createTextNode('Куратор: '));
        $curator.append($('<b></b>').text(curatorName));
        var curatorPhone = $roster.attr('data-curator-phone') || '';
        if (curatorPhone) {
          $curator.append($('<span class="sch-curator-phone"></span>').text(' ' + curatorPhone));
        }
      } else {
        $curator.append($('<span class="sch-empty"></span>').text('Куратор не назначен'));
      }
      $wrap.append($curator);
      $wrap.append(
        $('<p class="sch-roster-count"></p>').text('Состав группы: ' + $students.length + ' чел.')
      );
      if ($students.length) {
        var $list = $('<ul class="sch-roster-list"></ul>');
        $students.each(function () {
          $list.append($('<li></li>').text($(this).text()));
        });
        $wrap.append($list);
      } else {
        $wrap.append($('<p class="sch-empty"></p>').text('Студенты пока не добавлены.'));
      }
      $modalBody.append($wrap);
    }
    $modal.removeClass('hidden');
    $('body').addClass('sch-modal-open');
  }

  function closeModal() {
    if (!$modal.length || $modal.hasClass('hidden')) return;
    $modal.addClass('hidden');
    $('body').removeClass('sch-modal-open');
  }

  if ($modal.length) {
    $modal.on('click', function (e) {
      if ($(e.target).closest('[data-modal-close]').length) closeModal();
    });
    $(document).on('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  }

  /* Клик по названию группы в списке фильтра открывает модалку со составом;
     клик непосредственно по флажку только переключает активность. */
  if ($groupList.length) {
    $groupList.on('click', '.sch-check[data-group]', function (e) {
      if ($(e.target).closest('input').length) return;
      e.preventDefault();
      openRoster($(this).attr('data-group'));
    });

    $groupList.on('change', 'input[type="checkbox"]', function () {
      var $input = $(this);
      var $label = $input.closest('.sch-check[data-group]');
      if (!$label.length) return;
      var meta = groupMeta[$label.attr('data-group')];
      if (!meta) return;
      meta.enabled = $input.prop('checked');
      $label.toggleClass('inactive', !meta.enabled);
      syncGroupAll();
      apply();
    });
  }

  if ($groupAll.length) {
    $groupAll.on('change', function () {
      var checked = $groupAll.prop('checked');
      $.each(groupMeta, function (pk, meta) {
        if (meta.label.hasClass('hidden')) return;
        meta.enabled = checked;
        meta.check.prop('checked', checked);
        meta.label.toggleClass('inactive', !checked);
      });
      apply();
    });
  }

  /* Клик по карточке группы — модальное окно с деталями (как было). */
  $cards.on('click', function () {
    openCard($(this).attr('data-group'));
  });

  /* Сначала куратор — после его выбора открываются остальные фильтры и расписание. */
  if ($curatorSelect.length) {
    $curatorSelect.on('change', function () {
      state.curator = $curatorSelect.val() || '';
      updateCascade();
      refreshGroupList();
      apply();
    });
  }

  $weekdayRow.on('click', '.chip', function () {
    var $chip = $(this);
    setChipActive($weekdayRow, $chip);
    state.weekday = $chip.attr('data-weekday');
    apply();
  });

  if ($weekSelect.length) {
    $weekSelect.on('change', function () {
      readWeekFromSelect();
      positionWeek(); // новые даты в шапке недельного таймлайна
      apply();
    });
  }

  $hourFrom.on('change', function () { state.hourFrom = $hourFrom.val(); apply(); });
  $hourTo.on('change', function () { state.hourTo = $hourTo.val(); apply(); });

  $resetBtn.on('click', function () {
    state.curator = '';
    state.weekday = 'all';
    state.hourFrom = '';
    state.hourTo = '';
    $hourFrom.val(''); $hourTo.val('');
    // куратор снова не выбран — возвращаемся к шагу 1
    if ($curatorSelect.length) $curatorSelect.val('');
    setChipActive($weekdayRow, $weekdayRow.find('[data-weekday="all"]'));
    updateCascade();
    // все группы снова включены и видны (внутри скрытого списка)
    $.each(groupMeta, function (pk, meta) {
      meta.enabled = true;
      meta.check.prop('checked', true);
      meta.label.removeClass('inactive');
    });
    refreshGroupList();
    // текущая неделя
    var $current = $weekSelect.length ? $weekSelect.find('option[data-current="1"]') : $();
    if ($current.length) {
      $weekSelect.val($current.val());
      readWeekFromSelect();
      positionWeek();
    }
    apply();
  });

  /* Первичная синхронизация: каскад (куратор пока не выбран), группы, неделя.
     Таймлайн раскладываем сразу — он станет виден вместе с карточками. */
  updateCascade();
  refreshGroupList();
  positionWeek();
  updateWeekHeaders();
  apply();
});
</script>
