{# odt_document_page.html #}
{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1>{{ page.title }}</h1>
    </div>
</div>
<div class="container">
    {% if document_html %}
        <div class="odt-content card">
            {{ document_html|safe }}
        </div>
    {% else %}
        <p>Документ не загружен или не может быть отображен.</p>
    {% endif %}
</div>
{% endblock %}
